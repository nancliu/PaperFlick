[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflick"
version = "0.1.0"
description = "PaperFlick (纸闪) — personal Windows batch printing tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter",
    "pywin32; platform_system == 'Windows'",
    "pypdf",
    "pillow",
    "pymupdf==1.25.5",
    "python-docx",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.scripts]
paperflick = "paperflick.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
